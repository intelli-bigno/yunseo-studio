stages:
  tool:
    headline: A page you fill in before the event
    name: Baseline worksheet
    purpose: Record what you expect **before** an event, so you can compare it with what happens.
    how_to_use:
      - Write the event and the time it is scheduled for.
      - Note what you think the market already assumes, and where you read it.
      - After the result, add what happened next to each line.
    inputs: Your own notes and one public calendar
    outputs: A dated page you can compare line by line
    limits: It records your own baseline. It does not predict the result, and it does not tell you what to do.
    verified_scope: Tried by hand on past events that have a public schedule. Not tested on thinly covered markets or on intraday moves.
    applies_when:
      - The event has a public schedule
    not_when:
      - Prices move before you can write anything down
    distribution_note: Plain text. Copy it into any notes app.
