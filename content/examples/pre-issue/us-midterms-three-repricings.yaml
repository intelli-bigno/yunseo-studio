id: us-midterms-three-repricings
type: pre_issue
status: draft
language: en
as_of: null                  # 이 편이 근거로 삼은 자료의 가장 늦은 시각(ISO 8601) — 확인 전
importance: major
reels: { planned: false }
event:
  name: US midterm elections
  kind: election
  scheduled_at: null         # 확인 전 — 공식 일정을 출처와 함께 채운다
  timezone: null
cover:
  title: Three things markets will re-price after the US midterms
  hook: The result matters less than what it changes about what comes next.
stages:
  why_it_matters:
    headline: An election result is a change in expectations
    points:
      - Markets trade on what they expect to happen next, not on what already happened.
      - An election can change which policies look realistic. The useful question is not who wins, but **which expectations a surprise would actually move.**
  market_expectation:
    headline: A baseline, set before the result
    points:
      - Before the result, prices already lean toward a most-likely outcome.
      - "**Reading that baseline comes first.** A surprise matters most where the baseline is widely shared."
  scenarios:
    headline: Three outcomes, not predictions
    items:
      - id: close-to-baseline
        label: Close to the baseline
        condition: The outcome is near what the market already assumes.
        reading: Little is re-priced, and attention moves to the details of what comes next.
      - id: more-policy-room
        label: More room for policy change
        condition: The outcome makes larger shifts in spending, tax or regulation more plausible.
        reading: Sectors tied to those policies may need a new set of assumptions.
      - id: slow-unclear
        label: A slow, unclear result
        condition: Control takes time to settle.
        reading: Uncertainty itself becomes the story until it clears.
  transmission:
    headline: Three paths from the result to prices
    paths:
      - channel: Policy path
        via: Which proposals become more or less likely
        touches: [sectors tied to those policies]
      - channel: Fiscal outlook and rates
        via: Expectations for spending and borrowing
        touches: [government bond yields, the dollar]
      - channel: Sector exposure
        via: Expectations for regulation, trade and tax
        touches: [energy, health care, technology]
  after_checks:
    headline: Three signals you can verify yourself
    checks:
      - id: surprise-vs-baseline
        what: Whether the result was a surprise against the baseline you noted
        where: Compare your notes with the first official results
      - id: rate-expectations
        what: How expectations for interest rates moved
        where: Central bank communication and market-implied rate expectations
      - id: sector-moves
        what: Which sectors moved most
        where: Sector performance from a data source you trust
    closing: Write down your baseline first. Then compare it with the first official results.
