name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 릴스 합성 통합 테스트(packages/adapters/video)가 진짜 ffmpeg 를 쓴다 — 없으면 건너뛰지 않고 실패한다. 서체는 번인 자막의 기본 서체(DejaVu Sans)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pnpm run check
      - run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
